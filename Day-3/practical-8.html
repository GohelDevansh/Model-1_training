<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Layout</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 10px;
      font-family: Arial, sans-serif;
    }

    .container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 50px 250px 50px;
      gap: 10px;
      height: 100vh;
    }

    .header {
      grid-column: 1 / 3;
      background: gray;
      padding: 10px;
      color: white;
      font-size: 20px;
      text-align: center;
      display: flex;
      align-items:center ;
      justify-content: center;
    }

    .content {
      background: gray;
      padding: 10px;
      color: white;
      font-size: 20px;
      text-align: center;
      display: flex;
      align-items:center ;
      justify-content: center;
    }

    .sidebar {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      text-align: center;
     
    }

    .box {
      background: gray;
      padding: 10px;
      color: white;
      font-size: 20px;
      text-align: center;
      display: flex;
      align-items:center ;
      justify-content: center;
    }

    .footer {
      grid-column: 1 / 3;
      background: gray;
      padding: 10px;
      color: white;
      font-size: 20px;
      text-align: center;
      display: flex;
      align-items:center ;
      justify-content: center;
    }

    
  </style>
</head>

<body>

  <div class="container">

    <div class="header">HEADER</div>

    <div class="content">CONTENT</div>

    <div class="sidebar">
      <div class="box">HTML</div>
      <div class="box">CSS</div>
      <div class="box">JAVASCRIPT</div>
    </div>

    <div class="footer">FOOTER</div>

  </div>

</body>
</html>
