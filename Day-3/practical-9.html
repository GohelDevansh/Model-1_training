<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transform Animation</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }

    .box {
      width: 150px;
      height: 150px;
      background-color: royalblue;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;

     
      animation: transformEffect 4s infinite;
    }

    @keyframes transformEffect {
      0% {
        transform: translateX(0) rotate(0deg) scale(1);
      }

      25% {
        transform: translateX(100px) rotate(90deg) scale(1.2);
        background-color: tomato;
      }

      50% {
        transform: translateY(100px) rotate(180deg) scale(0.8);
        background-color: green;
      }

      75% {
        transform: translateX(-100px) rotate(270deg) scale(1.2);
        background-color: orange;
      }

      100% {
        transform: translateX(0) rotate(360deg) scale(1);
        background-color: royalblue;
      }
    }
  </style>
</head>

<body>

  <div class="box">
    Hello World
  </div>

</body>
</html>
