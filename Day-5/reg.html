<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
            linear-gradient(135deg,#141e30,#243b55);
        }

        .container{
            width: 400px;

            background: rgba(255,255,255,0.1);

            backdrop-filter: blur(12px);

            padding: 40px;

            border-radius: 20px;

            box-shadow:
            0px 0px 20px rgba(0,0,0,0.5);

            color: white;
        }

        .container h1{
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .input_box{
            position: relative;
            margin-bottom: 25px;
        }

        .input_box input{
            width: 100%;
            height: 50px;

            background: transparent;

            border: 2px solid rgba(255,255,255,0.3);

            outline: none;

            border-radius: 10px;

            padding-left: 50px;

            color: white;

            font-size: 16px;

            transition: 0.4s;
        }

        .input_box input:focus{
            border-color: #00ffff;
            box-shadow: 0px 0px 10px cyan;
        }

        .input_box i{
            position: absolute;

            left: 18px;
            top: 50%;

            transform: translateY(-50%);

            color: white;

            font-size: 18px;
        }

        .input_box input::placeholder{
            color: rgba(255,255,255,0.7);
        }

        .gender{
            margin-bottom: 20px;
        }

        .gender label{
            margin-right: 15px;
            font-size: 16px;
        }

        .btn{
            width: 100%;
            height: 50px;

            border: none;

            border-radius: 10px;

            background: linear-gradient(45deg,#00ffff,#0072ff);

            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: 0.5s;
        }

        .btn:hover{
            transform: scale(1.05);
            box-shadow: 0px 0px 15px cyan;
        }

        .login_text{
            text-align: center;
            margin-top: 20px;
        }

        .login_text a{
            color: cyan;
            text-decoration: none;
        }

        .login_text a:hover{
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Register</h1>

        <form>

            <!-- Full Name -->

            <div class="input_box">

                <i class="fa-solid fa-user"></i>

                <input
                type="text"
                placeholder="Full Name"
                required>

            </div>

            <!-- Email -->

            <div class="input_box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                placeholder="Email Address"
                required>

            </div>

            <!-- Phone -->

            <div class="input_box">

                <i class="fa-solid fa-phone"></i>

                <input
                type="tel"
                placeholder="Phone Number"
                required>

            </div>

            <!-- Password -->

            <div class="input_box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                placeholder="Password"
                required>

            </div>

            <!-- Confirm Password -->

            <div class="input_box">

                <i class="fa-solid fa-key"></i>

                <input
                type="password"
                placeholder="Confirm Password"
                required>

            </div>

            

            <div class="gender">
                Gender  
                <label>
                    <input type="radio" name="gender">
                    Male
                </label>

                <label>
                    <input type="radio" name="gender">
                    Female
                </label>

            </div>

            <!-- Button -->

            <button class="btn">
                <i class="fa-solid fa-user-plus"></i>
                Register
            </button>

            <!-- Login -->

            <div class="login_text">

                Already have an account?
                
 
Icon Family

Classic
Select an Icon Style
<i class="fas fa=etch fa-user"></i>

                <a href="#">Login</a>

            </div>

        </form>

    </div>

</body>
</html>
