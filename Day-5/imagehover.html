<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGAMOVIES</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
        }

   

        header{
            background-image: url(background.jpg);
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            min-height: 250px;
        }

        .box{
            width: 100%;
            height: 70px;
            padding: 15px;
        }

        .web_name{
            float: left;
            color: white;
            font-size: 35px;
            text-shadow: 0px 0px 10px red;
        }

        .side_note{
            float: right;
            color: white;
            padding-top: 15px;
            font-size: 18px;
        }

      

        nav{
            width: 100%;
        }

        ul{
            list-style: none;
            display: flex;
        }

        ul li{
            width: 20%;
            height: 50px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        ul li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.5s;
        }

        ul li:hover{
            background-color: red;
            border-radius: 50px;
        }

        ul li:hover a{
            letter-spacing: 2px;
        }

    

        .box2{
            width: 100%;
            text-align: center;
            padding-top: 50px;
        }

        .search_box{
            width: 60%;
            height: 45px;
            border: none;
            outline: none;
            padding-left: 20px;
            font-size: 18px;
            border-radius: 10px 0px 0px 10px;
        }

        .search_btn{
            width: 140px;
            height: 45px;
            border: none;
            background-color: red;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 0px 10px 10px 0px;
            transition: 0.5s;
        }

        .search_btn:hover{
            background-color: darkred;
        }



        .main_box{
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(to bottom, #111, #000);
            padding: 30px;
        }

        fieldset{
            border: 2px solid white;
            border-radius: 20px;
            padding: 20px;
        }

        legend{
            color: white;
            font-size: 28px;
            padding: 10px;
        }

       

        .movie_card{
            display: inline-block;
            overflow: hidden;
            border-radius: 15px;
            margin: 10px;
        }

        marquee{
            padding: 20px 0px;
        }

        marquee img{
            width: 220px;
            height: 320px;
            border-radius: 15px;
            transition: 0.6s;
            position: relative;
            top: 0px;
            box-shadow: 0px 0px 15px rgba(255,255,255,0.2);
        }

      

        marquee img:hover{
            /* transform: scale(1.1) rotateY(10deg); */
            top: -15px;
            cursor: pointer;
            box-shadow: 0px 0px 30px red;
            border: 3px solid white;
        }

    </style>

</head>

<body>

    <header>

        <div class="box">
            <h1 class="web_name">VEGAMOVIES</h1>

            <p class="side_note">
                Download, Watch Online and Enjoy Your Day
            </p>
        </div>

        

        <nav>

            <ul>

                <li><a href="#">Home</a></li>

                <li><a href="#">Audio</a></li>

                <li><a href="#">Video</a></li>

                <li><a href="#">Contact Us</a></li>

                <li><a href="#">About Us</a></li>

            </ul>

        </nav>

      

        <div class="box2">

            <form>

                <input type="search"
                placeholder="Search Movies..."
                class="search_box">

                <input type="submit"
                value="Search"
                class="search_btn">

            </form>

        </div>

    </header>

   

    <main>

        <div class="main_box">

            <fieldset>

                <legend>Movies</legend>

                

                <marquee behavior="scroll" direction="left" scrollamount="10">

                    <div class="movie_card">
                        <img src="images/a.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/b.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/c.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/d.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/e.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/f.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/g.webp" alt="">
                    </div>

                </marquee>

               

                <marquee behavior="scroll" direction="right" scrollamount="10">

                    <div class="movie_card">
                        <img src="images/g.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/f.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/e.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/d.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/c.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/b.webp" alt="">
                    </div>

                    <div class="movie_card">
                        <img src="images/a.webp" alt="">
                    </div>

                </marquee>

            </fieldset>

        </div>

    </main>

</body>
</html>
