<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Video Position Effect</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial;
}


.container{
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}



.video_card{
    width:250px;
    height:350px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
    transition:0.5s;
    box-shadow:0px 0px 15px rgba(255,255,255,0.2);
}


.video_card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:0.5s;
}


.overlay{
    position:absolute;
    bottom:-100%;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        to top,
        rgba(0,0,0,0.9),
        rgba(0,0,0,0.2)
    );
    color:white;
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    transition:0.5s;
}


.video_card:hover{
    transform:translateY(-20px);
    box-shadow:0px 0px 30px red;
}

.video_card:hover img{
    transform:scale(1.1);
}

.video_card:hover .overlay{
    bottom:0;
}



.overlay h2{
    margin-bottom:10px;
    font-size:28px;
}

.overlay p{
    font-size:15px;
    color:#ddd;
}

.play_btn{
    margin-top:15px;
    width:120px;
    height:40px;
    border:none;
    background:red;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:0.5s;
}

.play_btn:hover{
    background:white;
    color:black;
}

</style>

</head>

<body>

<div class="container">

  

    <div class="video_card">

        <img src="images/a.webp" alt="Movie">

        <div class="overlay">

            <h2> UNBREAKABLE</h2>

            <p>
                Action | Thriller | Drama
            </p>

            <button class="play_btn">
                ▶ Watch Now
            </button>

        </div>

    </div>

    

    <div class="video_card">

        <img src="images/b.webp" alt="Movie">

        <div class="overlay">

            <h2>SMILE</h2>

            <p>
                Mystery | Thriller| Horror
            </p>

            <button class="play_btn">
                ▶ Watch Now
            </button>

        </div>

    </div>

  

    <div class="video_card">

        <img src="images/c.webp" alt="Movie">

        <div class="overlay">

            <h2>CAPE FEAR</h2>

            <p>
                Sci-Fi | Action
            </p>

            <button class="play_btn">
                ▶ Watch Now
            </button>

        </div>

    </div>

</div>

</body>
</html>
