<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEGAMOVIES</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
            overflow-x: hidden;
        }

    

        header{
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
        }



        .bg-video{
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translate(-50%, -50%);
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Dark Overlay */

        .video_overlay{
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: -1;
        }

        /* Top Box */

        .box{
            width: 100%;
            height: 80px;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        .web_name{
            float: left;
            color: white;
            font-size: 40px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow: 0px 0px 10px red;
            }

            to{
                text-shadow:
                0px 0px 20px red,
                0px 0px 40px crimson,
                0px 0px 60px darkred;
            }
        }

        .side_note{
            float: right;
            color: white;
            padding-top: 15px;
            font-size: 18px;
        }

      

        nav{
            width: 100%;
            position: relative;
            z-index: 2;
        }

        ul{
            list-style: none;
            display: flex;
        }

        ul li{
            width: 20%;
            height: 55px;

            background: rgba(255,255,255,0.08);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255,255,255,0.1);

            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.5s;
        }

        ul li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.5s;
        }

        ul li:hover{
            background-color: red;
            border-radius: 50px;
        }

        ul li:hover a{
            letter-spacing: 2px;
        }

        /* ================= SEARCH BOX ================= */

        .box2{
            width: 100%;
            text-align: center;
            padding-top: 180px;
            position: relative;
            z-index: 2;

            animation: fadeUp 1.5s ease;
        }

        @keyframes fadeUp{
            from{
                opacity: 0;
                transform: translateY(50px);
            }

            to{
                opacity: 1;
                transform: translateY(0px);
            }
        }

        .search_box{
            width: 60%;
            height: 50px;
            border: none;
            outline: none;

            padding-left: 20px;

            font-size: 18px;

            border-radius: 10px 0px 0px 10px;
        }

        .search_btn{
            width: 150px;
            height: 50px;

            border: none;

            background-color: red;

            color: white;

            font-size: 18px;

            cursor: pointer;

            border-radius: 0px 10px 10px 0px;

            transition: 0.5s;
        }

        .search_btn:hover{
            background-color: darkred;
            letter-spacing: 1px;
        }

        

        .main_box{
            width: 100%;
            min-height: 100vh;

            background: linear-gradient(to bottom, #111, #000);

            padding: 30px;
        }

        fieldset{
            border: 2px solid white;
            border-radius: 20px;
            padding: 20px;
        }

        legend{
            color: white;
            font-size: 30px;
            padding: 10px;
        }

        marquee{
            padding: 20px 0px;
        }

        .movie_card{
            display: inline-block;
            overflow: hidden;
            border-radius: 15px;
            margin: 10px;
        }

        marquee img{
            width: 220px;
            height: 320px;

            border-radius: 15px;

            transition: 0.6s;

            position: relative;
            top: 0px;

            box-shadow: 0px 0px 15px rgba(255,255,255,0.2);
        }



        marquee img:hover{

            transform:
            scale(1.08)
            rotateY(10deg);

            top: -15px;

            cursor: pointer;

            box-shadow:
            0px 0px 20px red,
            0px 0px 40px crimson,
            0px 0px 60px darkred;

            border: 3px solid white;
        }

 

        @media(max-width:768px){

            .web_name{
                font-size: 28px;
            }

            .side_note{
                display: none;
            }

            ul{
                flex-direction: column;
            }

            ul li{
                width: 100%;
            }

            .search_box{
                width: 70%;
            }

            .search_btn{
                width: 100px;
            }

            marquee img{
                width: 160px;
                height: 240px;
            }

            .box2{
                padding-top: 100px;
            }
        }

    </style>

</head>

<body>


    <header>

        <!-- Background Video -->

        <video autoplay muted loop playsinline class="bg-video">

            <source src="video/video1.mp4" type="video/mp4">

        </video>

  

        <div class="video_overlay"></div>

   
        <div class="box">

            <h1 class="web_name">VEGAMOVIES</h1>

            <p class="side_note">
                Download, Watch Online and Enjoy Your Day
            </p>

        </div>

     

        <nav>

            <ul>

                <li><a href="#">Home</a></li>

                <li><a href="#">Audio</a></li>

                <li><a href="#">Video</a></li>

                <li><a href="#">Contact Us</a></li>

                <li><a href="#">About Us</a></li>

            </ul>

        </nav>



        <div class="box2">

            <form>

                <input
                type="search"
                placeholder="Search Movies..."
                class="search_box">

                <input
                type="submit"
                value="Search"
                class="search_btn">

            </form>

        </div>

    </header>

  

    <main>

        <div class="main_box">

            <fieldset>

                <legend>Movies</legend>

               

                <marquee
                behavior="scroll"
                direction="left"
                scrollamount="10">

                    <div class="movie_card">
                        <img src="images/a.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/b.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/c.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/d.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/e.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/f.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/g.webp">
                    </div>

                </marquee>

   

                <marquee
                behavior="scroll"
                direction="right"
                scrollamount="10">

                    <div class="movie_card">
                        <img src="images/g.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/f.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/e.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/d.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/c.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/b.webp">
                    </div>

                    <div class="movie_card">
                        <img src="images/a.webp">
                    </div>

                </marquee>

            </fieldset>

        </div>

    </main>

</body>
</html>
