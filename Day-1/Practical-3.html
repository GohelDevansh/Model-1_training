<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration From</h1>
    <form >
        <label> Name:</label>
        <input type="text" name="Name:"  placeholder="Enter Your Name" required><br><br>
        <label>Enrollment No:</label>


        <input type="text" name="Enrollment No" placeholder="Enter Your Enrollment No" required maxlength="12"><br><br>


        <label>Branch:</label>
        <select name="Branch">
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="AI">AI</option>
            <option value="CYBER SECURITY">CYBER SECURITY</option>
        </select><br><br>
       
    <label>Division</label>
    <input type="text" name="division" maxlength="1" size="1"> <br><br>
       
        <label>Gender:</label>
        <input type="radio" name="Gender" value="Male">Male
        <input type="radio" name="Gender" value="Female">Female
        <input type="radio" name="Gender" value="Other">Other
        <br><br>
        <label>Mobile No:</label>
        <input type="tel" name="Phone" placeholder="Enter Your Number" required><br><br>
       
        <label>Email id:</label>
        <input type="email" name="email id" placeholder="Enter your Email" required><br><br>


        <label>Password:</label>
        <input type="password" name="Password" required><br><br>


        <label>Photo</label>
        <input type="file" required><br><br>


        <label>Remark:</label>
        <textarea name="Remark" placeholder="Enter your Remarks"></textarea><br><br>
       


        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>
</body>
</html>
