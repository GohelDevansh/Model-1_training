<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe - React</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
    }

    .status {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .cell {
      width: 100px;
      height: 100px;
      font-size: 36px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 10px;
      background: #2d2d44;
      color: white;
      transition: 0.2s;
    }

    .cell:hover {
      background: #44446a;
    }

    .reset-btn {
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #ff4757;
      color: white;
    }

    .reset-btn:hover {
      background: #ff6b81;
    }
  </style>
</head>

<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const winningPatterns = [
      [0, 1, 2],
      [3, 4, 5],
      [6, 7, 8],
      [0, 3, 6],
      [1, 4, 7],
      [2, 5, 8],
      [0, 4, 8],
      [2, 4, 6],
    ];

    function App() {
      const [board, setBoard] = useState(Array(9).fill(null));
      const [isXTurn, setIsXTurn] = useState(true);

      const winner = calculateWinner(board);

      function handleClick(index) {
        if (board[index] || winner) return;

        const newBoard = [...board];
        newBoard[index] = isXTurn ? "X" : "O";

        setBoard(newBoard);
        setIsXTurn(!isXTurn);
      }

      function resetGame() {
        setBoard(Array(9).fill(null));
        setIsXTurn(true);
      }

      return (
        <div className="container">
          <h1>Tic Tac Toe</h1>

          <div className="status">
            {winner
              ? `Winner: ${winner}`
              : board.every(Boolean)
              ? "Draw!"
              : `Turn: ${isXTurn ? "X" : "O"}`}
          </div>

          <div className="board">
            {board.map((cell, index) => (
              <button
                key={index}
                className="cell"
                onClick={() => handleClick(index)}
              >
                {cell}
              </button>
            ))}
          </div>

          <button className="reset-btn" onClick={resetGame}>
            Restart Game
          </button>
        </div>
      );
    }

    function calculateWinner(board) {
      for (let pattern of winningPatterns) {
        const [a, b, c] = pattern;

        if (
          board[a] &&
          board[a] === board[b] &&
          board[a] === board[c]
        ) {
          return board[a];
        }
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

</body>
</html>
