<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar Page</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
        }

        nav{
            width: 100%;
            background-color: blue;
            padding: 15px;
        }

        ul{
            list-style: none;
            display: flex;
            justify-content: center;
        }

        li{
            margin: 0 20px;
        }

        a{
            text-decoration: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        a:hover{
            color: yellow;
        }

        .content{
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>
<header>
   <div class="header_box">
       <h1 class="header_title"> Sweets Shop</h1>
       <p class="header_para">Enjoy Your Sweets And Your Happy</p>
   </div>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Registration</a></li>
            <li><a href="#">Login</a></li>
            <li><a href="#">Gallery</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <div class="content">
        <h1>Welcome To My Website</h1>
        <p>This is a simple navigation bar page.</p>
    </div>

</body>
</html>
