<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind Rotation Animation</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
   
    @keyframes spin-slow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .spin-slow {
      animation: spin-slow 3s linear infinite;
    }
  </style>
</head>

<body class="flex items-center justify-center h-screen bg-gray-900">

  <div class="text-center space-y-8">


    <div class="w-40 h-40 bg-gradient-to-tr from-purple-500 to-pink-500 rounded-2xl shadow-2xl spin-slow
                hover:[animation-play-state:paused] transition">
    </div>

   
    

  </div>

</body>
</html>
