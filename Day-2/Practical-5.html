<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation Card</title>


<style>
    body{
        margin:0;
        padding:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #ffe6e6, #fff5cc);
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }


    .card{
        width:90%;
        max-width:850px;
        background:white;
        border-radius:20px;
        padding:25px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        text-align:center;
    }


    h1{
        color:#d63384;
        font-size:42px;
        margin-bottom:10px;
    }


    h2{
        color:#444;
        margin-top:0;
    }


    p{
        font-size:18px;
        color:#555;
    }


    img{
        width:100%;
        max-height:350px;
        object-fit:cover;
        border-radius:15px;
        margin-top:15px;
    }


    video{
        width:100%;
        border-radius:15px;
        margin-top:20px;
    }


    audio{
        margin-top:20px;
        width:100%;
    }


    .address{
        margin-top:20px;
        background:#fff0f5;
        padding:15px;
        border-radius:10px;
        font-size:18px;
    }


    iframe{
        width:100%;
        height:300px;
        border:0;
        border-radius:15px;
        margin-top:20px;
    }


    .footer{
        margin-top:25px;
        color:#999;
        font-size:16px;
    }
</style>
</head>


<body>


<div class="card">


    <h1>You're Invited!</h1>
    <h2>Wedding Celebration</h2>


    <p>
        Join us for a beautiful evening filled with love, joy, music, and celebration.
    </p>


    
    <img
    src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc"
    alt="Wedding Invitation">


    
    <video controls>
        <source src="https://youtu.be/h33gnC6kSGk?si=asfJEbwF7eLSaZqv" type="video/mp4">
        Your browser does not support the video tag.
    </video>


    <audio controls autoplay loop>
        <source src="song/wedding song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>


  
    <div class="address">
        <strong>Venue:</strong><br>
        Royal Palace Garden,<br>
        SG Highway, Ahmedabad,<br>
        Gujarat, India
    </div>


    <iframe
        src="https://www.google.com/maps?q=Ahmedabad,Gujarat&output=embed"
        allowfullscreen=""
        loading="lazy">
    </iframe>


    <div class="footer">
        Date: 20 December 2026 | Time: 7:00 PM
    </div>


</div>


</body>
</html>
