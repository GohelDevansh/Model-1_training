<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical-3 with semantic,css </title>
    <link rel="stylesheet" href="style.css">
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }
        body{
            
            font-family: Arial, sans-serif ;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }
          header{
            width: 100%;
            height: 150px;
            background-color: white;
            border-bottom: 3px solid black;
            display: flex;
            align-items: center;
        }

        #img-box{
            width: 450px;
            height: 150px;
            float: left;
             display: flex;
            align-items: center;
            justify-content: center;
        }
        #logo-box{
            /* width: auto;
            height: 150px;
            font-size: 65px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: 900;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center; */
              width: 75%;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            text-align: center;
            color: darkblue;

        }
        nav{
            background-color: #111;
            padding: 15px;
        }

        nav ul{
            list-style: none;
            text-align: center;
        }
        nav ul li{
            display: inline;
            margin: 0px 20px;
            

        }
         nav ul li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }
        
        nav ul li a:hover{
            color: yellow;
        }

        main{
           padding: 30px;
        }

         h1{
            text-align: center;
            margin-bottom: 25px;
            color: darkblue;
            font-size: 40px;
        }
        
        
        .form-box{
            width: 50%;
            margin: auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
        }
        
        form label{
            font-weight: bold;
            font-size: 18px;
        }

         form input,
        form select,
        form textarea{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea{
            resize: none;
            height: 80px;
        }

        .gender{
            width: auto;
            margin-right: 10px;
        }

        .btn{
            width: 45%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
         .submit-btn {
            background-color: green;
        }
         .reset-btn {
            background-color: green;
        }

        .btn:hover {
            opacity: 0.8;
        }
        /* footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
        */
        footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            font-size: 18px;
        }
        /* .reset-btn{
            background-color: red;
        } */

        .reset
        
    </style>
</head>
<body>
    <header>
        
            <div id="img-box">
                <img src="images.png" alt="">
            </div>
            <div id="logo-box">SILVER OAK UNIVERSITY</div>
       
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a>|</li>
            <li><a href="#">Signup</a> |</li>
            <li><a href="#">Signin</a> |</li>
            <li><a href="#">About Us</a> |</li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>


    
    <main>
    <section>
    <h1 style="text-align: center; color: black;">Registration From</h1>
    
   
    <div class="form-box">
    <form >
        <label> Name:</label>
        <input type="text" name="Name:"  placeholder="Enter Your Name" required><br><br>
        <label>Enrollment No:</label>


        <input type="text" name="Enrollment No" placeholder="Enter Your Enrollment No" required maxlength="13"><br><br>


        <label>Branch:</label>
        <select name="Branch">
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="AI">AI</option>
            <option value="CYBER SECURITY">CYBER SECURITY</option>
        </select><br><br>
       
    <label>Division</label>
    <input type="text" name="division" maxlength="1" size="1"> <br><br>
       
        <label>Gender:</label><br><br>
        <input type="radio" name="Gender" value="Male" class="gender">Male
        <input type="radio" name="Gender" value="Female" class="gender">Female
        <input type="radio" name="Gender" value="Other" class="gender">Other
        <br><br>
        <label>Mobile No:</label>
        <input type="tel" name="Phone" placeholder="Enter Your Number" required><br><br>
       
        <label>Email id:</label>
        <input type="email" name="email id" placeholder="Enter your Email" required><br><br>


        <label>Password:</label>
        <input type="password" name="Password" required><br><br>


        <label>Photo</label>
        <input type="file" required><br><br>


        <label>Remark:</label>
        <textarea name="Remark" placeholder="Enter your Remarks"></textarea><br><br>
        


        <input type="submit" value="Submit" class="btn submit-btn" style="margin-right: 20px;">
        <input type="reset" value="Clear"  class="btn reset-btn">
    </form>
    </div>
    </section>
    </main>

    <footer>
       <marquee> <p>© 2026 Registration Form. All Rights Reserved.</p></marquee>
    </footer>
</body>
</html>
