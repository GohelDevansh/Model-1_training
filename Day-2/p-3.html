<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical-3 with Semantic & CSS</title>

    <link rel="stylesheet" href="style.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }

        /* HEADER */

        header{
            width: 100%;
            height: 150px;
            background-color: white;
            border-bottom: 3px solid black;
            display: flex;
            align-items: center;
        }

        #img-box{
            width: 25%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #img-box img{
            width: 120px;
            height: 120px;
        }

        #logo-box{
            width: 75%;
            font-size: 50px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            text-align: center;
            color: darkblue;
        }

        /* NAVIGATION */

        nav{
            background-color: #111;
            padding: 15px;
        }

        nav ul{
            list-style: none;
            text-align: center;
        }

        nav ul li{
            display: inline-block;
            margin: 0 20px;
        }

        nav ul li a{
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover{
            color: yellow;
        }

        /* MAIN */

        main{
            padding: 30px;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: darkblue;
            font-size: 40px;
        }

        /* FORM BOX */

        .form-box{
            width: 50%;
            margin: auto;
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px gray;
        }

        form label{
            font-weight: bold;
            font-size: 18px;
        }

        form input,
        form select,
        form textarea{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea{
            resize: none;
            height: 80px;
        }

        /* RADIO BUTTON */

        .gender{
            width: auto;
            margin-right: 10px;
        }

        /* BUTTONS */

        .btn{
            width: 45%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn{
            background-color: green;
        }

         .submit-btn{
            background-color: green;
        }

        .btn:hover{
            opacity: 0.8;
        }

        /* FOOTER */

        footer{
            background-color: black;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            font-size: 18px;
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div id="img-box">

            <!-- Inline CSS -->
            <img src="images.png" alt="Logo"
                 style="border-radius: 10px; border: 2px solid black;">

        </div>

        <div id="logo-box">
            SILVER OAK UNIVERSITY
        </div>

    </header>

    <!-- NAVIGATION -->

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Signup</a></li>
            <li><a href="#">Signin</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>

    <!-- MAIN -->

    <main>

        <section>

            <h1>Registration Form</h1>

            <div class="form-box">

                <form>

                    <label>Name:</label>
                    <input type="text"
                           placeholder="Enter Your Name"
                           required>
                    <br><br>

                    <label>Enrollment No:</label>
                    <input type="text"
                           placeholder="Enter Your Enrollment No"
                           maxlength="12"
                           required>
                    <br><br>

                    <label>Branch:</label>
                    <select>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>AI</option>
                        <option>CYBER SECURITY</option>
                    </select>
                    <br><br>

                    <label>Division:</label>
                    <input type="text"
                           maxlength="1">
                    <br><br>

                    <label>Gender:</label>
                    <br><br>

                    <input type="radio" class="gender" name="Gender"> Male

                    <input type="radio" class="gender" name="Gender"> Female

                    <input type="radio" class="gender" name="Gender"> Other

                    <br><br>

                    <label>Mobile No:</label>
                    <input type="tel"
                           placeholder="Enter Your Number"
                           required>
                    <br><br>

                    <label>Email ID:</label>
                    <input type="email"
                           placeholder="Enter Your Email"
                           required>
                    <br><br>

                    <label>Password:</label>
                    <input type="password"
                           required>
                    <br><br>

                    <label>Photo:</label>
                    <input type="file">
                    <br><br>

                    <label>Remark:</label>
                    <textarea placeholder="Enter Your Remarks"></textarea>
                    <br><br>

                    <!-- Inline CSS -->
                    <input type="submit"
                           value="Submit"
                           class="btn submit-btn"
                           style="margin-right: 20px;">

                    <input type="reset"
                           value="Clear"
                           class="btn reset-btn">

                </form>

            </div>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>
        <marquee>
            © 2026 Registration Form | All Rights Reserved
        </marquee>
    </footer>

</body>
</html>
